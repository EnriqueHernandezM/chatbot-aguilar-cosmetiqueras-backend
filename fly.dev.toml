# fly.dev.toml app configuration for development

app = 'chatbot-distribuidora-aguilar-dev'
primary_region = 'dfw'

[build]

[env]
  NODE_ENV = 'development'

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
